format:
  html:
    # site/theme.scss holds the palette tokens and every rule; site/theme-dark.scss only overrides
    # the tokens. Quarto adds the light/dark toggle to the navbar.
    theme:
      light: [cosmo, site/theme.scss]
      dark: [cosmo, site/theme.scss, site/theme-dark.scss]
    # The @font-face rules sit beside the vendored font files they name (site/fonts/README.md).
    css:
      - site/fonts/fonts.css
    grid:
      sidebar-width: 250px
      body-width: 860px
      margin-width: 220px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    highlight-style: a11y
    link-external-newwindow: true
    filters:
      - site/filters/gfm.lua
    include-in-header:
      text: |
        <script>
          // First visit: follow the operating system's light/dark setting. Quarto 1.6 reads only
          // this stored value; the navbar toggle overwrites it.
          try {
            if (localStorage.getItem("quarto-color-scheme") === null &&
                matchMedia("(prefers-color-scheme: dark)").matches) {
              localStorage.setItem("quarto-color-scheme", "alternate");
            }
          } catch (e) {}
        </script>
        <script type="module">
          import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
          // Quarto adds `quarto-dark` to <body> after this module runs, so read its stored choice too.
          let dark = document.body.classList.contains("quarto-dark");
          try { dark = dark || localStorage.getItem("quarto-color-scheme") === "alternate"; } catch (e) {}
          mermaid.initialize({
            startOnLoad: true,
            securityLevel: "strict",
            theme: "base",
            themeVariables: dark
              ? { fontFamily: "Inter, system-ui, sans-serif", background: "#0e141b", primaryColor: "#1b3a60",
                  primaryTextColor: "#eef2f6", primaryBorderColor: "#86bde6", lineColor: "#9aa7b5",
                  secondaryColor: "#2a211a", tertiaryColor: "#161e28", edgeLabelBackground: "#161e28" }
              : { fontFamily: "Inter, system-ui, sans-serif", background: "#ffffff", primaryColor: "#e8eef6",
                  primaryTextColor: "#101f33", primaryBorderColor: "#132a4a", lineColor: "#5a6879",
                  secondaryColor: "#fdf3e6", tertiaryColor: "#f5f7fa", edgeLabelBackground: "#ffffff" },
          });
        </script>
