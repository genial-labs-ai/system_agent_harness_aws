# Builds the Quarto site (lectures, executed notebooks in mock mode, slides, docs). On a pull
# request it only builds, so a page that fails to render fails the PR instead of the next deploy;
# pushes to main (and manual runs) also deploy to GitHub Pages. No AWS credentials are involved.
name: pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The build needs nothing beyond reading the repository; Pages rights live on the deploy job.
permissions:
  contents: read

# One group per ref: a PR build never queues behind a deployment, a newer push to the same PR
# cancels the older build, and a deployment on main is never interrupted.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STOCKROOM_MODE: mock
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # Pinned to the exact tag: this action publishes no moving major tag (same as setup-uv).
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: "1.6.40"

      - name: Install
        run: |
          uv sync --group dev
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Render the site (Marp decks, then Quarto with notebooks executed in mock mode)
        run: make site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
