[project]
name = "stockroom-agent-evals"
version = "0.1.0"
description = "Evaluating Autonomous Agents workshop: the Stockroom reference agent, harness, eval suite and CI gate."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Workshop maintainers" }]
dependencies = [
  "boto3>=1.40",
  "pydantic>=2.9",
  "jsonschema==4.26.0",
  "pyyaml==6.0.3",
  "deepeval==4.2.8",
  "ragas==0.4.3",
  "mcp==2.3.0",
  "opentelemetry-api>=1.44.0,<1.46",
  "opentelemetry-sdk>=1.44.0,<1.46",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<1.46",
  "opentelemetry-semantic-conventions>=0.65b0,<0.67",
  "openinference-semantic-conventions==0.1.41",
]

[project.optional-dependencies]
# Local trace viewer (Day 2). Optional because it is a large dependency.
phoenix = ["arize-phoenix==20.19.0", "arize-phoenix-otel==0.17.2"]
# Live-mode CloudWatch GenAI observability via the AWS Distro for OpenTelemetry.
cloudwatch = ["aws-opentelemetry-distro==0.21.0"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff>=0.9",
  "jupytext==1.19.6",
  "nbformat>=5.10",
  "nbclient==0.11.0",
  "nbmake==1.5.5",
  "ipykernel==7.4.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[project.scripts]
stockroom = "stockroom.cli:main"

[tool.uv]
# The Phoenix and CloudWatch (ADOT) extras pin incompatible OpenTelemetry versions
# (arize-phoenix-otel 0.17.2 needs otlp-http >= 1.45; aws-opentelemetry-distro 0.21.0 pins sdk == 1.44.0).
# They are therefore mutually exclusive: `uv sync --extra phoenix` (local) or `uv sync --extra cloudwatch` (live).
conflicts = [[{ extra = "phoenix" }, { extra = "cloudwatch" }]]
# ragas 0.4.3 imports `langchain_community.chat_models.vertexai`, which langchain-community 0.4 removed.
constraint-dependencies = ["langchain-community>=0.3.27,<0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockroom"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]  # allow en-dashes etc. in docstrings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "live: requires AWS credentials and STOCKROOM_MODE=live (never run in CI)",
  "mcp_http: requires a running MCP HTTP server",
]
filterwarnings = ["ignore::DeprecationWarning"]
