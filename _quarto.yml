format:
  html:
    # site/theme.scss holds the palette tokens and every rule; site/theme-dark.scss only overrides
    # the tokens. Quarto adds the light/dark toggle to the navbar.
    theme:
      light: [cosmo, site/theme.scss]
      dark: [cosmo, site/theme.scss, site/theme-dark.scss]
    # The @font-face rules sit beside the vendored font files they name (site/fonts/README.md).
    css:
      - site/fonts/fonts.css
    grid:
      sidebar-width: 250px
      body-width: 860px
      margin-width: 220px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    highlight-style: a11y
    link-external-newwindow: true
    filters:
      - site/filters/gfm.lua
    include-in-header:
      text: |
        <script>
          // First visit: follow the operating system's light/dark setting. Quarto 1.6 reads only
          // this stored value; the navbar toggle overwrites it. Quarto 1.7 adds
          // `respect-user-color-scheme`, which does this properly: delete this block when
          // .github/workflows/pages.yml moves past 1.6.40 and set that option instead.
          try {
            if (location.protocol !== "file:" && // Quarto ignores storage for local files
                localStorage.getItem("quarto-color-scheme") === null &&
                matchMedia("(prefers-color-scheme: dark)").matches) {
              localStorage.setItem("quarto-color-scheme", "alternate");
            }
          } catch (e) {}
        </script>
        <script type="module">
          import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
          // Mermaid would otherwise render every diagram with its own defaults at the load event.
          mermaid.initialize({ startOnLoad: false });
          // The palette comes from the --ws-* custom properties that site/theme.scss publishes.
          // Quarto's own script sets the body class and swaps the stylesheet after the DOM is
          // parsed, and the toggle does the same later, so: read the wanted scheme from the body
          // class, wait (with timers, which also run in background tabs) until the published
          // scheme matches it, render, and do it again whenever the body class changes.
          const sources = new Map(); // each diagram's text, so it can be drawn again
          const scheme = () => getComputedStyle(document.documentElement).getPropertyValue("--ws-scheme").trim();
          const wanted = () => (document.body.classList.contains("quarto-dark") ? "dark" : "light");
          let drawn = null;
          let running = Promise.resolve(); // runs are chained: a toggle mid-render waits its turn
          const draw = () => {
            const css = getComputedStyle(document.documentElement);
            const v = (name) => css.getPropertyValue(name).trim();
            if (v("--ws-bg") === "") { return; } // no palette yet (stylesheet missing): keep the source
            for (const pre of document.querySelectorAll("pre.mermaid")) {
              if (!sources.has(pre)) { sources.set(pre, pre.textContent); }
              pre.textContent = sources.get(pre);
              pre.removeAttribute("data-processed");
            }
            mermaid.initialize({
              startOnLoad: false,
              securityLevel: "strict",
              theme: "base",
              themeVariables: {
                fontFamily: "Inter, system-ui, sans-serif",
                background: v("--ws-bg"),
                primaryColor: v("--ws-diagram-node"),
                primaryTextColor: v("--ws-heading"),
                primaryBorderColor: v("--ws-diagram-node-border"),
                lineColor: v("--ws-muted"),
                secondaryColor: v("--ws-accent-soft"),
                tertiaryColor: v("--ws-surface"),
                edgeLabelBackground: v("--ws-bg"),
              },
            });
            drawn = scheme();
            running = running
              .then(() => mermaid.run())
              .catch((e) => console.warn("mermaid:", e));
          };
          let pending = 0;
          const sync = () => {
            clearTimeout(pending);
            const started = Date.now();
            const tick = () => {
              if (scheme() === wanted()) {
                if (scheme() !== drawn) { running.then(draw); }
              } else {
                // Quarto sets the class and the stylesheet together, so they do meet; poll fast
                // at first, then slowly, and never draw with a palette that is not the wanted one.
                pending = setTimeout(tick, Date.now() - started < 2000 ? 30 : 500);
              }
            };
            tick();
          };
          const start = () => {
            sync();
            new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["class"] });
          };
          // Quarto's own DOMContentLoaded handler (registered while parsing) sets the body class;
          // starting after it avoids a light render that is redrawn dark a moment later.
          if (document.readyState === "complete") { start(); } else { document.addEventListener("DOMContentLoaded", start); }
        </script>
